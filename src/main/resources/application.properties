spring.application.name=rag-chatbot-application

server.port=8081

# ---- PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Atharva@2002}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5


# =====================================================
# Gemini Chat
# =====================================================

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY:YOUR_API_KEY_HERE}

spring.ai.google.genai.chat.options.model=gemini-3.6-flash


# =====================================================
# Gemini Embeddings
# =====================================================

spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY:YOUR_API_KEY_HERE}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# =====================================================
# PGVector
# =====================================================

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768


# =====================================================
# Actuator
# =====================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always



# ---- File upload limits (PDFs can be large) ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---- Phase 3: chunking config (tunable) ----
rag.chunking.chunk-size=500
rag.chunking.chunk-overlap=120

rag.embedding.batch-size=5
rag.embedding.max-retries=3
rag.embedding.initial-backoff-ms=2000

rag.url.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
rag.url.timeout-ms=15000
rag.url.max-body-bytes=8388608

# ---- Phase 5: RAG retrieval settings ----
rag.retrieval.top-k=6
rag.retrieval.similarity-threshold=0.5

# ---- RAG implementation mode ----
# advisor = idiomatic Spring AI QuestionAnswerAdvisor (production default)
# manual  = transparent hand-rolled pipeline with per-stage logging (tuning/observability)
rag.mode=${RAG_MODE:manual}

# Make the manual pipeline visible in logs
logging.level.com.rag_chatbot_application.service.impl.ManualRagService=INFO


# ---- Phase 6: retrieval quality + fan-out ----
# Specific queries: precise search
rag.retrieval.specific.top-k=6
rag.retrieval.specific.similarity-threshold=0.5
# Broad/summary queries: wide net, no threshold
rag.retrieval.broad.top-k=20
rag.retrieval.broad.similarity-threshold=0.45
rag.retrieval.broad.sub-queries=3
# Toggle fan-out on/off
rag.retrieval.fanout-enabled=true

# See retrieval decisions in logs
logging.level.rag_chatbot_application.service.impl.RetrievalServiceImpl=INFO