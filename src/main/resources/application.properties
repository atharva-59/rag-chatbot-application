spring.application.name=rag-chatbot-application

server.port=8081

# Active profile (override with SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5

# =====================================================
# Gemini Chat  (model set per-profile)
# =====================================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# =====================================================
# Gemini Embeddings  (shared ? embeddings stay pinned across profiles)
# =====================================================
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# =====================================================
# PGVector
# =====================================================
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
# initialize-schema is set per-profile (true in dev, false in prod)

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
# health detail visibility set per-profile

# ---- File upload limits (PDFs can be large) ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---- Phase 3: chunking config (tunable) ----
rag.chunking.chunk-size=500
rag.chunking.chunk-overlap=120

rag.embedding.batch-size=5
rag.embedding.max-retries=3
rag.embedding.initial-backoff-ms=2000

# ---- URL fetch ----
rag.url.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
rag.url.timeout-ms=15000
rag.url.max-body-bytes=8388608

# ---- Phase 5: RAG retrieval settings ----
rag.retrieval.top-k=6
rag.retrieval.similarity-threshold=0.5

# ---- Phase 6: retrieval quality + fan-out ----
# Amount of relevant chunks to retrieve for specific queries
rag.retrieval.specific.top-k=6
# Only allow chunks above this similarity score for specific queries
rag.retrieval.specific.similarity-threshold=0.5
# Broad/summary queries: wide net, low threshold
rag.retrieval.broad.top-k=20
rag.retrieval.broad.similarity-threshold=0.45
rag.retrieval.broad.sub-queries=3
# Toggle fan-out on/off
rag.retrieval.fanout-enabled=true

# ---- Phase 7: model fallback chain (tried in order) ----
rag.models.fallback-chain=${FALLBACK_CHAIN:gemini-3.6-flash,gemini-3.6-flash-lite}

# ---- Retry / timeout ----
rag.resilience.max-retries=2
rag.resilience.backoff-ms=800
rag.resilience.timeout-ms=30000
